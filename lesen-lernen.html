<style>
  :root{--paper:#f4ede0;--paper-deep:#ece1cf;--ink:#22201d;--ink-soft:#5a544c;
    --amber:#d97742;--amber-deep:#b85a2a;--teal:#3f8a7e;--teal-deep:#2c6b60;
    --line:#cdbfa8;--good:#6fa065;--good-bg:#e3ecd4;--gold:#e0a23d;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:"Zen Maru Gothic",sans-serif;background:var(--paper);
    background-image:radial-gradient(circle at 18% 12%,rgba(0,0,0,.025) 0,transparent 45%),radial-gradient(circle at 85% 88%,rgba(0,0,0,.03) 0,transparent 50%);
    color:var(--ink);overflow:hidden;display:flex;flex-direction:column;height:100dvh;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
  header{text-align:center;padding:12px 14px 2px;flex-shrink:0;}
  .kicker{font-family:"Shippori Mincho B1",Georgia,serif;font-size:11px;letter-spacing:.42em;color:var(--ink-soft);text-transform:uppercase;padding-left:.42em;}
  h1{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:22px;letter-spacing:.02em;}
  h1 .dot{color:var(--amber);}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 4px;flex-shrink:0;}
  .starsgroup{display:flex;align-items:center;gap:8px;}
  .stars{font-weight:900;font-size:20px;color:var(--amber-deep);display:flex;align-items:center;gap:4px;}
  .stars .s{font-size:22px;}
  .stars.pop{animation:spop .4s ease;}
  @keyframes spop{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
  .resetbtn{border:1.5px solid var(--line);background:var(--paper-deep);color:var(--ink-soft);
    width:34px;height:34px;border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .resetbtn:active{transform:translateY(1px);}
  .toggles{display:flex;gap:6px;}
  .tg{border:2px solid var(--line);background:transparent;border-radius:12px;font-size:20px;width:44px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .tg.on{border-color:var(--amber);background:#fdf2e8;}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:0;padding:10px 14px;}
  .pic{font-size:clamp(76px,26vw,130px);line-height:1;user-select:none;}
  .prompt{font-family:"Shippori Mincho B1",Georgia,serif;font-weight:800;font-size:clamp(34px,11vw,52px);letter-spacing:.01em;}
  .choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .choice{border:none;background:#fff;border:2px solid var(--line);border-radius:16px;cursor:pointer;
    font-family:"Shippori Mincho B1",Georgia,serif;font-weight:800;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.08);}
  .choice.wordc{min-width:112px;height:62px;font-size:26px;padding:0 18px;letter-spacing:.01em;}
  .choice.picc{width:92px;height:92px;font-size:52px;}
  .choice:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.08);}
  .choice.right{background:var(--good-bg);border-color:var(--good);color:var(--good);}
  .choice.wrong{animation:shake .4s;opacity:.5;}
  @keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(5px)}50%{transform:translateX(-7px)}}
  .burst{position:fixed;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:5;}
  .burst span{position:absolute;font-size:40px;animation:fly .75s ease-out forwards;}
  @keyframes fly{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
</style>
</head>

"🍋", "de": "Zitrone", "en": "lemon"}, {"e": "🍒", "de": "Kirsche", "en": "cherry"}, {"e": "🍑", "de": "Pfirsich", "en": "peach"}, {"e": "🍍", "de": "Ananas", "en": "pineapple"}, {"e": "🥝", "de": "Kiwi", "en": "kiwi"}, {"e": "🥥", "de": "Kokosnuss", "en": "coconut"}, {"e": "🍅", "de": "Tomate", "en": "tomato"}, {"e": "🥔", "de": "Kartoffel", "en": "potato"}, {"e": "🌽", "de": "Mais", "en": "corn"}, {"e": "🥦", "de": "Brokkoli", "en": "broccoli"}, {"e": "🥒", "de": "Gurke", "en": "cucumber"}, {"e": "🧅", "de": "Zwiebel", "en": "onion"}, {"e": "🍆", "de": "Aubergine", "en": "eggplant"}, {"e": "🫐", "de": "Blaubeere", "en": "blueberry"}, {"e": "🍈", "de": "Melone", "en": "melon"}, {"e": "🍰", "de": "Kuchen", "en": "cake"}, {"e": "🍪", "de": "Keks", "en": "cookie"}, {"e": "🍩", "de": "Donut", "en": "donut"}, {"e": "🍫", "de": "Schokolade", "en": "chocolate"}, {"e": "🧁", "de": "Muffin", "en": "muffin"}, {"e": "🥨", "de": "Brezel", "en": "pretzel"}, {"e": "🧇", "de": "Waffel", "en": "waffle"}, {"e": "🍕", "de": "Pizza", "en": "pizza"}, {"e": "🍔", "de": "Burger", "en": "burger"}, {"e": "🍟", "de": "Pommes", "en": "fries"}, {"e": "🥛", "de": "Milch", "en": "milk"}, {"e": "🍵", "de": "Tee", "en": "tea"}];
const TITLE={de:"Lesen lernen",en:"Learn to Read"};
let lang="de", stars=0, recent=[], locked=false;

try{ const v=localStorage.getItem("read-stars"); if(v) stars=parseInt(v)||0; }catch(e){}

const TIERS=[
  {min:3,max:4,opts:3,sameFirst:false},
  {min:4,max:5,opts:3,sameFirst:false},
  {min:5,max:6,opts:4,sameFirst:false},
  {min:6,max:8,opts:4,sameFirst:true},
  {min:7,max:10,opts:4,sameFirst:true},
  {min:8,max:30,opts:5,sameFirst:true},
];
function tierFor(n){ return n<6?0 : n<16?1 : n<30?2 : n<48?3 : n<70?4 : 5; }
function wordFor(it){ return lang==="de"?it.de:it.en; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function setStars(n){ stars=n; document.getElementById("starCount").textContent=stars; try{localStorage.setItem("read-stars",stars);}catch(e){} }
function burst(n){
  const b=document.createElement("div"); b.className="burst";
  for(let i=0;i<n;i++){ const s=document.createElement("span"); s.textContent="⭐";
    const ang=(Math.PI*2*i)/n, dist=90+Math.random()*50;
    s.style.setProperty("--dx",(Math.cos(ang)*dist)+"px"); s.style.setProperty("--dy",(Math.sin(ang)*dist)+"px");
    b.appendChild(s);
  }
  document.body.appendChild(b); setTimeout(()=>b.remove(),760);
}
function award(){
  setStars(stars+1);
  const el=document.getElementById("stars"); el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
  burst(6); if(navigator.vibrate) navigator.vibrate([20,30,20]);
}
function levelUp(){
  burst(14);
  const t=document.createElement("div"); t.className="burst"; t.innerHTML='<span style="--dx:0px;--dy:-30px;font-size:64px">🎉</span>';
  document.body.appendChild(t); setTimeout(()=>t.remove(),850);
  if(navigator.vibrate) navigator.vibrate([30,40,30,40,80]);
}
function poolForTier(cfg){
  let pool=[];
  for(let w=0; w<12; w++){ pool=ITEMS.filter(it=>{const L=wordFor(it).length; return L>=cfg.min-w && L<=cfg.max+w;}); if(pool.length>=cfg.opts+2) break; }
  return pool;
}
function pickItem(pool){
  let avail=pool.filter(it=>!recent.includes(it.en));
  if(avail.length===0) avail=pool;
  const it=avail[Math.floor(Math.random()*avail.length)];
  recent.push(it.en); if(recent.length>8) recent.shift();
  return it;
}
function newQuestion(){
  locked=false;
  const stage=document.getElementById("stage"); stage.innerHTML="";
  const cfg=TIERS[tierFor(stars)];
  const pool=poolForTier(cfg);
  const item=pickItem(pool);
  const word=wordFor(item);
  const mode=Math.random()<0.5 ? "pic2word":"word2pic";
  stage.dataset.answer=item.en; stage.dataset.mode=mode;

  if(mode==="pic2word"){
    const pic=document.createElement("div"); pic.className="pic"; pic.textContent=item.e; stage.appendChild(pic);
    const others=[...new Set(ITEMS.map(wordFor))].filter(w=>w!==word);
    let distract=[];
    if(cfg.sameFirst) distract=shuffle(others.filter(w=>w[0]===word[0])).slice(0,cfg.opts-1);
    if(distract.length<cfg.opts-1){ const rest=shuffle(others.filter(w=>!distract.includes(w))); distract=distract.concat(rest).slice(0,cfg.opts-1); }
    const opts=shuffle([word,...distract]);
    const box=document.createElement("div"); box.className="choices";
    opts.forEach(W=>{ const b=document.createElement("button"); b.className="choice wordc"; b.textContent=W;
      if(W===word) b.dataset.correct="true"; b.onclick=()=>answer(b, W===word); box.appendChild(b); });
    stage.appendChild(box);
  } else {
    const pr=document.createElement("div"); pr.className="prompt"; pr.textContent=word; stage.appendChild(pr);
    const otherItems=shuffle(ITEMS.filter(it=>it.en!==item.en)).slice(0,cfg.opts-1);
    const opts=shuffle([item,...otherItems]);
    const box=document.createElement("div"); box.className="choices";
    opts.forEach(it=>{ const b=document.createElement("button"); b.className="choice picc"; b.textContent=it.e;
      if(it.en===item.en) b.dataset.correct="true"; b.onclick=()=>answer(b, it.en===item.en); box.appendChild(b); });
    stage.appendChild(box);
  }
}
function penalise(){
  if(stars<=0) return;
  setStars(stars-1);
  const el=document.getElementById("stars"); el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
}
function answer(btn, correct){
  if(locked) return;
  if(correct){
    locked=true;
    document.querySelectorAll(".choice").forEach(c=>{ c.disabled=true; c.style.pointerEvents="none"; });
    btn.classList.add("right");
    const before=tierFor(stars); award(); if(tierFor(stars)>before) levelUp();
    setTimeout(newQuestion,750);
  } else {
    if(btn.disabled || btn.classList.contains("wrong")) return;
    btn.classList.add("wrong"); btn.disabled=true; btn.style.pointerEvents="none";
    penalise();
    if(navigator.vibrate) navigator.vibrate(40);
  }
}
function refresh(){
  document.querySelectorAll(".tg").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));
  document.getElementById("title").innerHTML=TITLE[lang]+'<span class="dot">.</span>';
  document.documentElement.lang=lang;
  document.getElementById("starCount").textContent=stars;
  recent=[]; newQuestion();
}
document.querySelectorAll(".tg").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;refresh();});
document.getElementById("reset").onclick=()=>{ setStars(0); recent=[]; newQuestion(); };
refresh();
</script>
