<title>Wörter Raten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4ede0; --paper-deep:#ece1cf; --ink:#22201d; --ink-soft:#5a544c;
    --amber:#d97742; --amber-deep:#b85a2a; --teal:#3f8a7e;
    --line:#cdbfa8; --correct:#6fa065; --present:#e0a23d; --absent:#a79c88;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:"Zen Maru Gothic",sans-serif;background:var(--paper);
    background-image:radial-gradient(circle at 18% 12%,rgba(0,0,0,.025) 0,transparent 45%),radial-gradient(circle at 85% 88%,rgba(0,0,0,.03) 0,transparent 50%);
    color:var(--ink);overflow:hidden;display:flex;flex-direction:column;height:100dvh;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
  header{text-align:center;padding:14px 14px 4px;flex-shrink:0;}
  .kicker{font-family:"Shippori Mincho B1",serif;font-size:11px;letter-spacing:.42em;color:var(--ink-soft);text-transform:uppercase;padding-left:.42em;}
  h1{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:25px;letter-spacing:.03em;}
  h1 .dot{color:var(--amber);}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:0;padding:6px 10px;}
  #board{display:grid;grid-template-rows:repeat(6,1fr);gap:7px;}
  .brow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
  .tile{width:54px;height:54px;border:2px solid var(--line);border-radius:10px;background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:"Shippori Mincho B1",Georgia,serif;font-weight:800;font-size:28px;color:var(--ink);
    text-transform:uppercase;transition:transform .1s,background .2s,border-color .2s,color .2s;}
  .tile.filled{border-color:var(--ink-soft);animation:pop .12s ease;}
  @keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
  .tile.correct{background:var(--correct);border-color:var(--correct);color:#fff;}
  .tile.present{background:var(--present);border-color:var(--present);color:#fff;}
  .tile.absent{background:var(--absent);border-color:var(--absent);color:#fff;}
  .brow.shake{animation:shake .4s;}
  @keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(5px)}50%{transform:translateX(-7px)}}
  .msg{min-height:22px;font-weight:700;font-size:15px;color:var(--amber-deep);text-align:center;}
  .pad{flex-shrink:0;padding:6px 6px 10px;}
  .krow{display:flex;gap:5px;justify-content:center;margin-bottom:6px;}
  .key{flex:1 1 auto;max-width:34px;height:50px;border:none;background:var(--paper-deep);border:1.5px solid var(--line);
    border-radius:9px;font-family:"Zen Maru Gothic","Segoe UI",system-ui,sans-serif;font-weight:900;font-size:16px;color:var(--ink);
    cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;padding:0;}
  .key:active{transform:translateY(2px);box-shadow:none;}
  .key.wide{max-width:56px;font-size:18px;background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 2px 0 #000;}
  .key.correct{background:var(--correct);color:#fff;border-color:var(--correct);box-shadow:0 2px 0 #567d4e;}
  .key.present{background:var(--present);color:#fff;border-color:var(--present);box-shadow:0 2px 0 #b57f26;}
  .key.absent{background:var(--absent);color:#fff;border-color:var(--absent);box-shadow:0 2px 0 #857b69;}
  .newbtn{display:block;margin:2px auto 0;background:transparent;border:1.5px solid var(--line);color:var(--ink-soft);
    font-family:"Zen Maru Gothic";font-weight:700;font-size:13px;padding:8px 20px;border-radius:12px;cursor:pointer;}
  .win{position:fixed;inset:0;background:rgba(244,237,224,.93);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:10;padding:20px;text-align:center;}
  .win.show{display:flex;animation:fade .3s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .win .party{font-size:60px;animation:bpop .5s ease;}
  @keyframes bpop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
  .win h2{font-family:"Shippori Mincho B1",serif;font-size:27px;color:var(--amber-deep);}
  .win .wd{font-family:"Shippori Mincho B1",Georgia,serif;font-size:34px;font-weight:800;letter-spacing:.12em;color:var(--ink);}
  .win button{background:var(--teal);color:#fff;border:none;font-family:"Zen Maru Gothic";font-weight:900;font-size:17px;padding:12px 30px;border-radius:16px;box-shadow:0 4px 0 #2c6b60;cursor:pointer;}
</style>
</head>
<body>
  <header>
    <div class="kicker">Vier Buchstaben</div>
    <h1>Wörter Raten<span class="dot">.</span></h1>
  </header>
  <main class="stage">
    <div id="board"></div>
    <div class="msg" id="msg"></div>
  </main>
  <div class="pad">
    <div id="keyboard"></div>
    <button class="newbtn" id="newbtn">Neues Wort</button>
  </div>
  <div class="win" id="win">
    <div class="party" id="winEmoji">🎉</div>
    <h2 id="winText">Super!</h2>
    <div class="wd" id="winWord"></div>
    <button id="again">Neues Wort</button>
  </div>
<script>
const WORDS = ["MAUS", "BAUM", "HAUS", "BALL", "AUTO", "ENTE", "NASE", "HAND", "EULE", "HASE", "IGEL", "BOOT", "ROSE", "MOND", "BROT", "BUCH", "BETT", "BERG", "TIER", "HERZ", "MUND", "BEIN", "AUGE", "HOSE", "FRAU", "MANN", "KIND", "WORT", "WALD", "GRAS", "GOLD", "RING", "GELD", "BURG", "HUHN", "ESEL", "WOLF", "WURM", "MEER", "WIND", "WELT", "FELD", "ZELT", "SALZ", "SAFT", "REIS", "NAME", "BABY", "TURM", "BLAU", "GELB", "ROSA", "GRÜN", "KÄSE", "LÖWE"];
const LEN=4, ROWS=6;
let answer, row, col, board, keyState, over;

function newGame(force){
  answer = force || WORDS[Math.floor(Math.random()*WORDS.length)];
  row=0; col=0; over=false; keyState={};
  board=Array.from({length:ROWS},()=>Array(LEN).fill(""));
  buildBoard(); buildKeyboard(); setMsg("");
  document.getElementById("win").classList.remove("show");
}
function buildBoard(){
  const b=document.getElementById("board"); b.innerHTML="";
  for(let r=0;r<ROWS;r++){
    const rd=document.createElement("div"); rd.className="brow"; rd.dataset.r=r;
    for(let c=0;c<LEN;c++){
      const t=document.createElement("div"); t.className="tile"; t.dataset.r=r; t.dataset.c=c;
      rd.appendChild(t);
    }
    b.appendChild(rd);
  }
}
const KB=[["Q","W","E","R","T","Z","U","I","O","P","Ü"],
          ["A","S","D","F","G","H","J","K","L","Ö","Ä"],
          ["⏎","Y","X","C","V","B","N","M","⌫"]];
function buildKeyboard(){
  const kb=document.getElementById("keyboard"); kb.innerHTML="";
  KB.forEach(rowk=>{
    const kr=document.createElement("div"); kr.className="krow";
    rowk.forEach(k=>{
      const btn=document.createElement("button"); btn.className="key"; btn.textContent=k;
      if(k==="⏎"||k==="⌫") btn.classList.add("wide");
      else if(keyState[k]) btn.classList.add(keyState[k]);
      btn.onclick=()=>press(k);
      kr.appendChild(btn);
    });
    kb.appendChild(kr);
  });
}
function setMsg(m){document.getElementById("msg").textContent=m;}
function tileEl(r,c){return document.querySelector(`.tile[data-r="${r}"][data-c="${c}"]`);}

function press(k){
  if(over) return;
  if(k==="⌫"){ if(col>0){col--;board[row][col]="";const t=tileEl(row,col);t.textContent="";t.classList.remove("filled");} return; }
  if(k==="⏎"){ submit(); return; }
  if(col<LEN){ board[row][col]=k; const t=tileEl(row,col); t.textContent=k; t.classList.add("filled"); col++; }
}
function score(guess){
  const res=Array(LEN).fill("absent"), cnt={};
  for(const c of answer) cnt[c]=(cnt[c]||0)+1;
  for(let i=0;i<LEN;i++) if(guess[i]===answer[i]){res[i]="correct";cnt[guess[i]]--;}
  for(let i=0;i<LEN;i++){ if(res[i]==="correct") continue; const c=guess[i]; if(cnt[c]>0){res[i]="present";cnt[c]--;} }
  return res;
}
const rank={absent:0,present:1,correct:2};
function submit(){
  if(col<LEN){ const rd=document.querySelector(`.brow[data-r="${row}"]`); rd.classList.remove("shake"); void rd.offsetWidth; rd.classList.add("shake"); setMsg("Noch "+(LEN-col)+" Buchstaben"); return; }
  const guess=board[row].join("");
  const res=score(guess);
  res.forEach((st,i)=>{ const t=tileEl(row,i); t.classList.add(st); const L=guess[i];
    if(!keyState[L]||rank[st]>rank[keyState[L]]) keyState[L]=st; });
  buildKeyboard();
  if(navigator.vibrate) navigator.vibrate(10);
  if(guess===answer){ over=true; setTimeout(()=>finish(true),350); return; }
  row++; col=0;
  if(row>=ROWS){ over=true; setTimeout(()=>finish(false),350); }
  else setMsg("");
}
function finish(won){
  document.getElementById("winEmoji").textContent=won?"🎉":"🙈";
  document.getElementById("winText").textContent=won?"Super gemacht!":"Schade!";
  document.getElementById("winWord").textContent=won?answer:("Das Wort war: "+answer);
  document.getElementById("win").classList.add("show");
  if(navigator.vibrate) navigator.vibrate(won?[30,40,30,40,60]:[60]);
}
document.getElementById("newbtn").onclick=()=>newGame();
document.getElementById("again").onclick=()=>newGame();
window.addEventListener("keydown",e=>{
  if(over&&e.key!=="Enter") return;
  const k=e.key;
  if(k==="Enter") press("⏎");
  else if(k==="Backspace") press("⌫");
  else { const u=k.toUpperCase(); if(/^[A-ZÄÖÜ]$/.test(u)) press(u); }
});
newGame();
</script>
</body>
</html>
