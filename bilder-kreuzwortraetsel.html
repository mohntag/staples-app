<title>Bilder-Kreuzworträtsel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4ede0; --paper-deep:#ece1cf; --ink:#22201d; --ink-soft:#5a544c;
    --amber:#d97742; --amber-deep:#b85a2a; --teal:#3f8a7e; --teal-deep:#2c6b60;
    --line:#cdbfa8; --good:#7faa6b; --good-bg:#e3ecd4;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"Zen Maru Gothic",sans-serif; background:var(--paper);
    background-image:
      radial-gradient(circle at 18% 12%, rgba(0,0,0,.025) 0, transparent 45%),
      radial-gradient(circle at 85% 88%, rgba(0,0,0,.03) 0, transparent 50%);
    color:var(--ink); overflow:hidden; display:flex; flex-direction:column; height:100dvh;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  }
  header{text-align:center;padding:12px 14px 6px;flex-shrink:0;}
  .kicker{font-family:"Shippori Mincho B1",serif;font-size:11px;letter-spacing:.45em;color:var(--ink-soft);text-transform:uppercase;padding-left:.45em;}
  h1{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:23px;letter-spacing:.02em;}
  h1 .dot{color:var(--amber);}
  .levels{display:flex;gap:8px;justify-content:center;padding:8px 14px 4px;flex-shrink:0;}
  .lvl{border:2px solid var(--line);background:transparent;color:var(--ink-soft);font-family:"Zen Maru Gothic";font-weight:700;font-size:14px;padding:7px 20px;border-radius:14px;cursor:pointer;}
  .lvl.on{background:var(--amber);border-color:var(--amber);color:#fff;box-shadow:0 3px 0 var(--amber-deep);}
  .meta{text-align:center;font-size:12px;color:var(--ink-soft);padding:3px 0 0;font-weight:700;letter-spacing:.06em;}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0;padding:4px 10px;overflow:hidden;}
  .gridwrap{display:flex;align-items:center;justify-content:center;flex:1;min-height:0;width:100%;}
  #grid{display:grid;gap:4px;}
  .cell{aspect-ratio:1;background:#fff;border:2px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;font-family:"Shippori Mincho B1",Georgia,"Times New Roman",serif;font-weight:800;color:var(--ink);cursor:pointer;user-select:none;transition:background .12s,border-color .12s,transform .08s;}
  .cell.empty{background:transparent;border:none;cursor:default;}
  .cell.sel{border-color:var(--amber);background:#fdf2e8;}
  .cell.active{border-color:var(--amber-deep);background:var(--amber);color:#fff;transform:scale(1.04);}
  .cell.good{background:var(--good-bg);border-color:var(--good);color:var(--good);}
  .cell .num{position:absolute;top:1px;left:3px;font-family:"Zen Maru Gothic";font-weight:700;font-size:9px;color:var(--ink-soft);}
  .cell.active .num{color:#fff;}
  .cluebar{display:flex;align-items:center;gap:10px;background:var(--paper-deep);border:2px solid var(--line);border-radius:16px;padding:8px 14px;min-height:52px;width:100%;max-width:420px;}
  .cluebar .big{font-size:30px;line-height:1;}
  .cluebar .txt{font-weight:700;font-size:15px;color:var(--ink);}
  .cluebar .dir{margin-left:auto;font-size:20px;color:var(--amber-deep);}
  .clues{display:flex;gap:7px;overflow-x:auto;width:100%;max-width:440px;padding:2px 2px 4px;-webkit-overflow-scrolling:touch;}
  .clues::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;width:46px;height:46px;border-radius:13px;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;cursor:pointer;}
  .chip.on{border-color:var(--amber);background:#fdf2e8;}
  .chip.done{border-color:var(--good);background:var(--good-bg);}
  .chip .n{position:absolute;top:-2px;left:3px;font-size:9px;font-weight:700;color:var(--ink-soft);font-family:"Zen Maru Gothic";}
  .pad{flex-shrink:0;padding:6px 8px 8px;}
  .keys{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:520px;margin:0 auto;}
  .key{min-width:34px;height:46px;padding:0 4px;border:none;background:var(--paper-deep);border:1.5px solid var(--line);border-radius:11px;font-family:"Zen Maru Gothic","Segoe UI",system-ui,sans-serif;font-weight:900;font-size:19px;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.08);}
  .key:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.08);}
  .key.wide{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 3px 0 #000;}
  .row2{display:flex;gap:8px;justify-content:center;margin-top:8px;}
  .act{border:1.5px solid var(--line);background:transparent;color:var(--ink-soft);font-family:"Zen Maru Gothic";font-weight:700;font-size:13px;padding:8px 18px;border-radius:12px;cursor:pointer;}
  .win{position:fixed;inset:0;background:rgba(244,237,224,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:10;}
  .win.show{display:flex;animation:fade .3s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .win .party{font-size:64px;animation:pop .5s ease;}
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
  .win h2{font-family:"Shippori Mincho B1",serif;font-size:30px;color:var(--amber-deep);}
  .win button{background:var(--teal);color:#fff;border:none;font-family:"Zen Maru Gothic";font-weight:900;font-size:17px;padding:12px 30px;border-radius:16px;box-shadow:0 4px 0 var(--teal-deep);cursor:pointer;}
</style>
</head>
<body>
  <header>
    <div class="kicker">Bilder &middot; Rätsel</div>
    <h1>Kreuzworträtsel<span class="dot">.</span></h1>
  </header>
  <div class="levels">
    <button class="lvl on" data-l="leicht">Leicht</button>
    <button class="lvl" data-l="schwer">Schwer</button>
  </div>
  <div class="meta" id="meta"></div>
  <main class="stage">
    <div class="gridwrap"><div id="grid"></div></div>
    <div class="cluebar"><span class="big" id="clueBig">🐶</span><span class="txt" id="clueTxt">Tippe ein Bild an</span><span class="dir" id="clueDir"></span></div>
    <div class="clues" id="clues"></div>
  </main>
  <div class="pad">
    <div class="keys" id="keys"></div>
    <div class="row2"><button class="act" id="reset">Nochmal</button><button class="act" id="newp">Neues Rätsel ↻</button></div>
  </div>
  <div class="win" id="win">
    <div class="party">🎉</div>
    <h2>Geschafft!</h2>
    <button id="again">Neues Rätsel</button>
  </div>
<script>
const PUZZLES = {"leicht": [{"R": 4, "C": 7, "words": [["NASE", "👃", 2, 3, "A"], ["HUND", "🐶", 0, 3, "D"], ["UHR", "⏰", 0, 2, "A"], ["IGEL", "🦔", 0, 6, "D"], ["MOND", "🌙", 3, 0, "A"], ["BAUM", "🌳", 0, 0, "D"]]}, {"R": 7, "C": 6, "words": [["AUTO", "🚗", 1, 2, "A"], ["HAUS", "🏠", 0, 2, "D"], ["BUS", "🚌", 3, 0, "A"], ["OHR", "👂", 1, 5, "D"], ["KUH", "🐮", 0, 0, "A"], ["BALL", "⚽", 3, 0, "D"]]}, {"R": 7, "C": 4, "words": [["KÄSE", "🧀", 5, 0, "A"], ["IGEL", "🦔", 3, 3, "D"], ["BÄR", "🐻", 4, 1, "D"], ["EI", "🥚", 3, 2, "A"], ["NASE", "👃", 0, 2, "D"], ["MOND", "🌙", 0, 0, "A"]]}, {"R": 6, "C": 6, "words": [["HAND", "✋", 3, 1, "A"], ["MAUS", "🐭", 2, 2, "D"], ["HUND", "🐶", 0, 4, "D"], ["UHR", "⏰", 0, 3, "A"], ["EIS", "🍦", 5, 0, "A"]]}], "schwer": [{"R": 6, "C": 10, "words": [["BLUME", "🌸", 2, 2, "A"], ["ENTE", "🦆", 2, 6, "D"], ["BAUM", "🌳", 2, 2, "D"], ["MAUS", "🐭", 0, 4, "D"], ["STERN", "⭐", 4, 5, "A"], ["HUND", "🐶", 2, 9, "D"], ["HAUS", "🏠", 4, 0, "A"], ["MOND", "🌙", 0, 4, "A"], ["FISCH", "🐟", 0, 0, "D"]]}, {"R": 10, "C": 9, "words": [["BIENE", "🐝", 4, 4, "A"], ["BANANE", "🍌", 4, 4, "D"], ["BLUME", "🌸", 0, 6, "D"], ["BIRNE", "🍐", 0, 8, "D"], ["STERN", "⭐", 6, 0, "A"], ["VOGEL", "🐦", 9, 1, "A"], ["FROSCH", "🐸", 3, 0, "D"], ["WOLKE", "☁️", 2, 2, "D"], ["NASE", "👃", 4, 7, "D"]]}, {"R": 8, "C": 7, "words": [["KÄSE", "🧀", 1, 0, "A"], ["EULE", "🦉", 1, 3, "D"], ["HASE", "🐰", 4, 0, "A"], ["LÖWE", "🦁", 3, 3, "A"], ["AUGE", "👁️", 4, 1, "D"], ["AFFE", "🐵", 0, 6, "D"], ["HERZ", "❤️", 7, 0, "A"], ["BÄR", "🐻", 0, 1, "D"], ["WOLKE", "☁️", 3, 5, "D"]]}, {"R": 8, "C": 9, "words": [["STERN", "⭐", 3, 2, "A"], ["BROT", "🍞", 0, 3, "D"], ["BERG", "⛰️", 1, 5, "D"], ["SONNE", "☀️", 3, 2, "D"], ["MUND", "👄", 5, 0, "A"], ["BUCH", "📖", 1, 5, "A"], ["BETT", "🛏️", 7, 1, "A"], ["HAUS", "🏠", 1, 8, "D"], ["BAUM", "🌳", 2, 0, "D"]]}]};
let level="leicht", pIdx=0, P, cells, numbers, user, sel=null;

function setup(){
  const list=PUZZLES[level];
  pIdx=((pIdx%list.length)+list.length)%list.length;
  P=list[pIdx];
  cells={};            // "r,c" -> {sol, words:[i]}
  P.words.forEach((w,i)=>{
    const [word,emoji,r,c,d]=w;
    for(let k=0;k<word.length;k++){
      const rr=d==="A"?r:r+k, cc=d==="A"?c+k:c, key=rr+","+cc;
      if(!cells[key]) cells[key]={sol:word[k],words:[]};
      cells[key].words.push(i);
    }
  });
  // numbering by reading order of start cells
  const starts=P.words.map((w,i)=>({i,r:w[2],c:w[3]}));
  const order=[...new Set(starts.map(s=>s.r+","+s.c))]
    .map(k=>({k,r:+k.split(",")[0],c:+k.split(",")[1]}))
    .sort((a,b)=>a.r-b.r||a.c-b.c);
  numbers={}; order.forEach((o,idx)=>numbers[o.k]=idx+1);
  user={};
  buildClues(); buildGrid(); buildKeys(); sel=null; updateClueBar();
  document.querySelectorAll(".lvl").forEach(b=>b.classList.toggle("on",b.dataset.l===level));
  updateMeta();
  document.getElementById("win").classList.remove("show");
}

function buildGrid(){
  const g=document.getElementById("grid");
  g.style.gridTemplateColumns=`repeat(${P.C},1fr)`;
  const fb=Math.min(46, Math.floor((Math.min(window.innerWidth*0.92,440))/P.C)-4);
  g.style.width=(P.C*(fb+4))+"px";
  g.innerHTML="";
  for(let r=0;r<P.R;r++)for(let c=0;c<P.C;c++){
    const key=r+","+c, d=document.createElement("div");
    if(!cells[key]){d.className="cell empty";g.appendChild(d);continue;}
    d.className="cell"; d.dataset.key=key;
    if(numbers[key]){const n=document.createElement("span");n.className="num";n.textContent=numbers[key];d.appendChild(n);}
    const t=document.createElement("span");t.className="ltr";d.appendChild(t);
    d.onclick=()=>tapCell(key);
    g.appendChild(d);
  }
  render();
  requestAnimationFrame(fitGrid);
}
function fitGrid(){
  const g=document.getElementById("grid"); if(!g) return;
  const wrap=g.parentElement, gap=4;
  const availW=wrap.clientWidth, availH=wrap.clientHeight;
  if(!availW||!availH) return;
  const byW=(availW-(P.C-1)*gap)/P.C;
  const byH=(availH-(P.R-1)*gap)/P.R;
  let cell=Math.floor(Math.min(byW,byH));
  cell=Math.max(22,Math.min(54,cell));
  g.style.width=(P.C*cell+(P.C-1)*gap)+"px";
  g.querySelectorAll(".cell").forEach(c=>{c.style.fontSize=Math.round(cell*0.5)+"px";});
}
function buildClues(){
  const wrap=document.getElementById("clues"); wrap.innerHTML="";
  P.words.forEach((w,i)=>{
    const [word,emoji,r,c]=w, key=r+","+c;
    const chip=document.createElement("div"); chip.className="chip"; chip.dataset.i=i;
    chip.innerHTML=`<span class="n">${numbers[key]}</span>${emoji}`;
    chip.onclick=()=>selectWord(i);
    wrap.appendChild(chip);
  });
}
function buildKeys(){
  const set=new Set();
  P.words.forEach(w=>{for(const ch of w[0])set.add(ch);});
  const letters=[...set].sort((a,b)=>a.localeCompare(b,"de"));
  const keys=document.getElementById("keys"); keys.innerHTML="";
  letters.forEach(L=>{
    const b=document.createElement("button"); b.className="key"; b.textContent=L;
    b.onclick=()=>typeLetter(L); keys.appendChild(b);
  });
  const bk=document.createElement("button"); bk.className="key wide"; bk.textContent="⌫";
  bk.onclick=backspace; keys.appendChild(bk);
}

function tapCell(key){
  const ws=cells[key].words;
  if(sel && ws.includes(sel.wi) && ws.length>1){
    const other=ws.find(x=>x!==sel.wi); selectWord(other, key);
  } else {
    selectWord(ws[0], key);
  }
}
function wordCells(i){
  const [word,e,r,c,d]=P.words[i], arr=[];
  for(let k=0;k<word.length;k++) arr.push((d==="A"?r:r+k)+","+(d==="A"?c+k:c));
  return arr;
}
function selectWord(i, focusKey){
  const wc=wordCells(i);
  let pos = focusKey ? wc.indexOf(focusKey) : wc.findIndex(k=>!user[k]);
  if(pos<0) pos=0;
  sel={wi:i, cellsList:wc, pos};
  updateClueBar(); render();
}
function updateClueBar(){
  const big=document.getElementById("clueBig"),txt=document.getElementById("clueTxt"),dir=document.getElementById("clueDir");
  if(sel==null){big.textContent="❓";txt.textContent="Tippe ein Bild an";dir.textContent="";return;}
  const w=P.words[sel.wi]; big.textContent=w[1];
  txt.textContent=w[0].length+" Buchstaben"; dir.textContent=w[4]==="A"?"→":"↓";
}
function typeLetter(L){
  if(sel==null) return;
  const key=sel.cellsList[sel.pos];
  user[key]=L;
  if(sel.pos<sel.cellsList.length-1) sel.pos++;
  render(); checkWin();
}
function backspace(){
  if(sel==null) return;
  let key=sel.cellsList[sel.pos];
  if(!user[key] && sel.pos>0){sel.pos--; key=sel.cellsList[sel.pos];}
  delete user[key]; render();
}
function wordDone(i){return wordCells(i).every(k=>user[k]===cells[k].sol);}
function render(){
  document.querySelectorAll(".cell").forEach(d=>{
    const key=d.dataset.key; if(!key) return;
    const ltr=d.querySelector(".ltr"); ltr.textContent=user[key]||"";
    d.classList.remove("sel","active","good");
    if(sel && sel.cellsList.includes(key)) d.classList.add("sel");
    if(sel && sel.cellsList[sel.pos]===key) d.classList.add("active");
    if(cells[key].words.some(wordDone)) d.classList.add("good");
  });
  document.querySelectorAll(".chip").forEach(ch=>{
    const i=+ch.dataset.i;
    if(i>=P.words.length) return;
    ch.classList.toggle("done", wordDone(i));
    ch.classList.toggle("on", sel && sel.wi===i);
  });
}
function checkWin(){
  const all=Object.keys(cells).every(k=>user[k]===cells[k].sol);
  if(all){ setTimeout(()=>document.getElementById("win").classList.add("show"),250);
    if(navigator.vibrate) navigator.vibrate([30,40,30,40,60]); }
}

function updateMeta(){const m=document.getElementById("meta");if(m)m.textContent="Rätsel "+(pIdx+1)+"/"+PUZZLES[level].length;}
function newPuzzle(){const list=PUZZLES[level];if(list.length>1){let n;do{n=Math.floor(Math.random()*list.length);}while(n===pIdx);pIdx=n;}else{pIdx=0;}setup();}
document.querySelectorAll(".lvl").forEach(b=>b.onclick=()=>{level=b.dataset.l;pIdx=0;setup();});
document.getElementById("reset").onclick=()=>{user={};sel=null;updateClueBar();render();};
document.getElementById("again").onclick=()=>{newPuzzle();};
document.getElementById("newp").onclick=()=>{newPuzzle();};
window.addEventListener("resize",()=>fitGrid());
setup();
</script>
</body>
</html>
